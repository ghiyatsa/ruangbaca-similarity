name: Python Test CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # Gerbang cepat: pastikan SELURUH berkas Python (termasuk scripts/ dan
      # tests/) bisa dikompilasi. pytest hanya meng-import tests/, sehingga
      # berkas rusak di scripts/ tidak akan pernah tertangkap tanpa langkah ini.
      - name: Syntax check all Python files
        run: python -m compileall -q app scripts tests main.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          SYNC_SECRET: "test_sync_secret_minimal_length"
        run: |
          python -m pytest tests/ -v
